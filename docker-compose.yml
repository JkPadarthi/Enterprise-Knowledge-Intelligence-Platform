# GraphRAG Engine — local infrastructure
# Brings up the two stateful stores used by the pipeline.
#   - Neo4j      : knowledge graph (Phase 3)
#   - ChromaDB   : vector store (Phase 1, embedded by default; this is the server mode)
#
# ChromaDB is used in EMBEDDED persistent mode by default (no container needed).
# Uncomment the chromadb service + set CHROMA_HOST in .env to use server mode instead.

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_auth__minimum__password__length: "4"
    volumes:
      - ${HOME}/docker/neo4j/data:/data
      - ${HOME}/docker/neo4j/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: "no"

  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: graphrag-chroma
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ${HOME}/docker/chroma:/chroma/chroma
  #   restart: unless-stopped

# Named-volume blocks removed: Neo4j/Chroma data now bind-mount into ${HOME}/docker
# (see the volumes: entries above) so the data lives in plain folders you control.
